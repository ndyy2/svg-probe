<svg xmlns="http://www.w3.org/2000/svg" width="124" height="124" viewBox="0 0 124 124" role="img" aria-label="instagram">
  <title>instagram</title>
  <defs>
    <filter id="neu" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="-5" dy="-5" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="5" result="b1"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.55" result="c1"/>
      <feComposite in="c1" in2="b1" operator="in" result="s1"/>
      <feOffset in="SourceAlpha" dx="5" dy="5" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="5" result="b2"/>
      <feFlood flood-color="#8f9bb0" flood-opacity="0.65" result="c2"/>
      <feComposite in="c2" in2="b2" operator="in" result="s2"/>
      <feMerge>
        <feMergeNode in="s2"/>
        <feMergeNode in="s1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="22" y="22" width="80" height="80" rx="26" fill="#e4405f" filter="url(#neu)"/>
  <g transform="translate(62,62) scale(1.6666666666666667) translate(-12,-12)" fill="#ffffff" color="#ffffff">
    <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.35" fill="currentColor"/>
  </g>
</svg>
